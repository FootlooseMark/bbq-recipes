<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0B09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smokehouse Notes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="IMG_2037.png">
<title>Smokehouse Notes</title>
<style>
:root{--bg:#0F0B09;--card:#241C17;--line:#3A2E26;--ember:#E8631A;--tx:#F3EDE6;--mu:#A89C92;--chip:#2E2520}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 8px)}
header{padding:10px 14px 0}
.top{display:flex;align-items:center;justify-content:space-between;font-size:19px;font-weight:600;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:Rockwell,'Rockwell Bold','American Typewriter',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.5px}
.top button{background:0;border:0;color:var(--mu);font-size:24px}
input,select,textarea{width:100%;background:var(--chip);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:16px;background:var(--chip);color:#D9CEC4;font-size:13px;border:0}
.chip.on{background:var(--ember);color:#17120F;font-weight:600}
.st{position:relative;display:inline-block;color:#6A5A4E;font-size:20px;line-height:1}
.st b{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--ember);font-weight:400}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 60px;z-index:5}
.sheet h2{font-size:24px;margin:10px 0 6px}
.sheet h4{margin:18px 0 6px;color:var(--mu);font-weight:500;font-size:13px}
.sheet li{margin-left:20px;margin-bottom:4px}.sheet ol{margin-left:22px}.sheet ol li{margin-left:0;margin-bottom:10px}
.sheet p{white-space:pre-wrap}
.hero{height:240px;border-radius:16px;background:#3A2A20 center/cover}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{background:var(--chip);border-radius:12px;padding:4px 10px;font-size:13px}
.btn{display:block;text-align:center;background:var(--ember);color:#17120F;font-weight:600;border:0;border-radius:12px;padding:12px;margin-top:14px;text-decoration:none;font-size:16px;width:100%}
.btn.g{background:var(--chip);color:var(--tx)}
.vid{display:block;position:relative;border-radius:12px;overflow:hidden}.vid img{width:100%;display:block}.vid span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;background:rgba(0,0,0,.25)}
.row{display:flex;gap:10px}
.x{background:0;border:0;color:var(--ember);font-size:17px;padding:6px 0}
label{display:block;margin:14px 0 4px;color:var(--mu);font-size:13px}
#main{flex:1;overflow-y:auto;padding:0 14px 20px}
header{padding:10px 14px 10px}
.empty{color:var(--mu);text-align:center;padding:50px 20px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.sh h3{font-size:14px;letter-spacing:1px;text-transform:uppercase}.sh a{color:var(--mu);font-size:24px}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.th{background:#3A2A20 center/cover;flex:none}
.tl{flex:none;width:170px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding-bottom:10px}
.tl .th{height:112px;margin-bottom:8px}.tl b,.tl small,.tl>div:last-child{display:block;padding:0 10px}
.tl small,.rw small{color:var(--mu);font-size:12px}
.rw{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:10px}
.rw .th{width:96px;height:80px;border-radius:10px}.rw .in{min-width:0;flex:1}.rw b,.rw small{display:block}
.tl .st,.rw .st{font-size:15px}
.ct{flex:none;background:0;border:0;color:var(--tx);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;width:66px}
.ct i{font-style:normal;font-size:28px;width:58px;height:58px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center}
nav{display:flex;border-top:1px solid var(--line);background:#1E1713;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:0;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--ember)}
.pt{margin:14px 0 8px}.pi{width:100%;border-radius:12px}
.pk{display:inline-flex;align-items:center;background:var(--chip);border-radius:12px;padding:6px 10px;margin:0 6px 6px 0;color:var(--tx);font-size:14px}.pk input{width:auto;margin-right:6px}
</style></head><body>
<div id="app">
<header><div class="top"><span class="brand"><img src="IMG_2037.png" alt="" width="42" height="42" style="border-radius:10px">Smokehouse Notes</span><button id="more" aria-label="Backup">&#8943;</button></div>
<input id="q" type="search" placeholder="Search recipes, seasonings, pantry"></header>
<div id="main"></div>
<nav id="nav"></nav>
</div>
<script>
const P=['Beef','Pork','Chicken','Turkey','Lamb','Duck','Quail','Fish','Shellfish','Game','Sausage','Other'],
T=['Main','Side','Rub/Sauce'],M=['Traeger','Blackstone','Grill','Stovetop','Oven','Crockpot'],D=['Rookie','Griller','Pitmaster'];
let R=[],PN=[],pf='All',q='',tab='home',pc='All';
const E={Beef:'🥩',Pork:'🐖',Chicken:'🍗',Turkey:'🦃',Lamb:'🐑',Duck:'🦆',Quail:'🐦',Fish:'🐟',Shellfish:'🦐',Game:'🦌',Sausage:'🌭',Other:'🍽️'},PC=['Spice','Rub','Seasoning blend','Brine','Marinade','Sauce','Wood/Pellets','Other'],
IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',explore:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>',add:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',cooks:'<path d="M12 20s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/>',pantry:'<rect x="6" y="7" width="12" height="14" rx="2"/><path d="M7 7V4h10v3M6 12h12"/>'};
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
yt=u=>{const m=(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);return m?m[1]:''},
stars=r=>`<span class="st">★★★★★<b style="width:${r*20}%">★★★★★</b></span>`,
opts=(a,v)=>a.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('');
const db=new Promise((ok,no)=>{const r=indexedDB.open('smokehouse',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=no});
const load=async()=>{const d=await db,g=k=>new Promise(ok=>{const z=d.transaction('kv').objectStore('kv').get(k);z.onsuccess=()=>ok(z.result||[]);z.onerror=()=>ok([])});return[await g('r'),await g('p')]};
const put=async(k,v)=>{const d=await db;d.transaction('kv','readwrite').objectStore('kv').put(v,k)},save=()=>put('r',R),savePN=()=>put('p',PN);
const rate=r=>`${stars(r.r)} <span>${r.r?r.r.toFixed(1):''}</span>`,
ph=r=>r.img?`background-image:url(${r.img})`:'',
mini=r=>`<div class="rw" data-id="${r.id}"><div class="th" style="${ph(r)}"></div><div class="in"><b>${esc(r.n)}</b><small>${esc([r.p,r.m,r.c].filter(Boolean).join(' · '))}</small><div>${rate(r)}</div></div></div>`,
tile=r=>`<div class="tl" data-id="${r.id}"><div class="th" style="${ph(r)}"></div><b>${esc(r.n)}</b><small>${esc([r.c,r.d].filter(Boolean).join(' · '))}</small><div>${rate(r)}</div></div>`,
pmini=x=>`<div class="rw" data-pn="${x.id}"><div class="th" style="${x.f?`background-image:url(${x.f})`:''}"></div><div class="in"><b>${esc(x.n)}</b><small>${esc(x.c)}</small></div></div>`,
sec=(h,b,go)=>`<div class="sh"><h3>${h}</h3>${go?`<a data-go="${go}">›</a>`:''}</div>${b}`,
pnames=r=>(r.pn||[]).map(i=>(PN.find(x=>x.id==i)||{}).n||'').join(' '),
chipRow=(a,cur,k)=>`<div class="chips">${a.map(p=>`<button class="chip${p==cur?' on':''}" data-${k}="${p}">${p}</button>`).join('')}</div>`;
function show(keep){const m=$('#main'),st=m.scrollTop;
$('#nav').innerHTML=[['home','Home'],['explore','Explore'],['add','Add Recipe'],['cooks','My Cooks'],['pantry','Pantry']].map(([k,l])=>`<button data-t="${k}" class="${k==tab?'on':''}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join('');
let h='';
if(tab=='home'){const fv=R.filter(r=>r.f),rc=[...R].sort((a,b)=>b.id-a.id).slice(0,8),tp=[...R].filter(r=>r.r>0).sort((a,b)=>b.r-a.r).slice(0,10);
h=R.length?(fv.length?sec('Favorites',`<div class="hs">${fv.map(tile).join('')}</div>`,'cooks'):'')+sec('Recently added',`<div class="hs">${rc.map(tile).join('')}</div>`)+sec('By category',`<div class="hs">${P.map(p=>`<button class="ct" data-p="${p}"><i>${E[p]}</i>${p}</button>`).join('')}</div>`)+(tp.length?sec('Top rated',tp.map(mini).join('')):''):'<p class="empty">No recipes yet. Tap Add Recipe to save your first cook.</p>'}
else if(tab=='pantry'){const L=PN.filter(x=>(pc=='All'||x.c==pc)&&(!q||(x.n+' '+x.c).toLowerCase().includes(q)));
h=`<button class="btn" data-addpn>+ Add pantry item</button>${chipRow(['All',...PC],pc,'pc')}`+(L.length?L.map(pmini).join(''):'<p class="empty">Nothing here yet. Add your rubs, spices, brines and sauces with photos of the label.</p>')}
else{const L=R.filter(r=>(!q||(r.n+' '+r.i+' '+r.s+' '+r.p+' '+r.m+' '+r.t+' '+pnames(r)).toLowerCase().includes(q))&&(tab=='cooks'?r.f:(pf=='All'||r.p==pf))),pm=tab=='explore'&&q?PN.filter(x=>(x.n+' '+x.c).toLowerCase().includes(q)):[];
h=(tab=='explore'?chipRow(['All',...P],pf,'p'):'<h3 class="pt">My Cooks</h3>')+(pm.length?sec('Pantry',pm.map(pmini).join('')):'')+(L.length?L.map(mini).join(''):'<p class="empty">No matches.</p>')}
m.innerHTML=h;m.scrollTop=keep?st:0}
function pdetail(id){const x=PN.find(y=>y.id==id);if(!x)return;const u=R.filter(r=>(r.pn||[]).includes(x.id));
const s=sheet(`<button class="x" data-x>‹ Back</button><h2>${esc(x.n)}</h2><div class="tags"><span>${esc(x.c)}</span></div>${x.f?`<h4>Front label</h4><img class="pi" src="${x.f}">`:''}${x.b?`<h4>Ingredients</h4><img class="pi" src="${x.b}">`:''}${u.length?`<h4>Used in</h4>${u.map(mini).join('')}`:''}<div class="row"><button class="btn g" data-e>Edit</button><button class="btn g" data-d>Delete</button></div>`);
s.onclick=e=>{const t=e.target.closest('[data-id]');if(t){s.remove();detail(t.dataset.id)}};
s.querySelector('[data-e]').onclick=()=>{s.remove();pform(x)};
s.querySelector('[data-d]').onclick=()=>{if(confirm('Delete this item?')){PN=PN.filter(y=>y.id!=id);R.forEach(r=>r.pn=(r.pn||[]).filter(i=>i!=id));save();savePN();show(1);s.remove()}}}
function pform(x={}){let f=x.f||'',b=x.b||'';
const s=sheet(`<button class="x" data-x>‹ Cancel</button><h2>${x.id?'Edit item':'New pantry item'}</h2><label>Name</label><input id="nn" value="${esc(x.n)}" placeholder="Memphis dry rub"><label>Category</label><select id="nc">${opts(PC,x.c)}</select><label>Front label photo</label><input type="file" id="nf" accept="image/*"><label>Ingredients photo</label><input type="file" id="nb" accept="image/*"><button class="btn" id="ns">Save item</button>`);
s.querySelector('#nf').onchange=async e=>{if(e.target.files[0])f=await shrink(e.target.files[0])};
s.querySelector('#nb').onchange=async e=>{if(e.target.files[0])b=await shrink(e.target.files[0])};
s.querySelector('#ns').onclick=()=>{const n=s.querySelector('#nn').value.trim();if(!n){alert('Enter a name');return}const o={id:x.id||Date.now(),n,c:s.querySelector('#nc').value,f,b};PN=x.id?PN.map(y=>y.id==x.id?o:y):[o,...PN];savePN();show(1);s.remove()}}
function sheet(h){const s=document.createElement('div');s.className='sheet';s.innerHTML=h;document.body.appendChild(s);s.querySelector('[data-x]')?.addEventListener('click',()=>s.remove());return s}
function detail(id){const r=R.find(x=>x.id==id);if(!r)return;
const s=sheet(`<button class="x" data-x>‹ Back</button><div class="hero" style="${r.img?`background-image:url(${r.img})`:''}"></div><h2>${esc(r.n)}</h2>${stars(r.r)} ${r.r?r.r.toFixed(1):''}
<div class="tags">${[r.p,r.t,r.m,r.d,r.c].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>
${r.i?`<h4>Ingredients</h4><ul>${r.i.split('\n').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
${(r.pn||[]).length?`<h4>Seasonings used</h4><div class="tags">${r.pn.map(i=>{const x=PN.find(y=>y.id==i);return x?`<span data-pn="${x.id}">${esc(x.n)}</span>`:''}).join('')}</div>`:''}
${r.s?`<h4>Steps</h4><ol>${r.s.split('\n').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
${/^https?:\/\//i.test(r.v||'')?(yt(r.v)?`<h4>Video</h4><a class="vid" href="${esc(r.v)}" target="_blank" rel="noopener"><img src="https://img.youtube.com/vi/${yt(r.v)}/hqdefault.jpg" alt="Video thumbnail"><span>&#9654;</span></a>`:`<a class="btn g" href="${esc(r.v)}" target="_blank" rel="noopener">Watch video</a>`):''}
${r.k?`<h4>Comments</h4><p>${esc(r.k)}</p>`:''}
<button class="btn g" data-f>${r.f?'♥ Favorited':'♡ Favorite'}</button><button class="btn" data-s>Share as photo</button><div class="row"><button class="btn g" data-e>Edit</button><button class="btn g" data-d>Delete</button></div>`);
s.querySelector('[data-s]').onclick=()=>share(r);
s.querySelector('[data-f]').onclick=e=>{r.f=!r.f;save();show(1);e.target.textContent=r.f?'♥ Favorited':'♡ Favorite'};
s.addEventListener('click',e=>{const k=e.target.closest('[data-pn]');if(k)pdetail(k.dataset.pn)});
s.querySelector('[data-e]').onclick=()=>{s.remove();form(r)};
s.querySelector('[data-d]').onclick=()=>{if(confirm('Delete this recipe?')){R=R.filter(x=>x.id!=id);save();show(1);s.remove()}}}
async function share(r){
const W=1080,P=56,tw=W-2*P,F='-apple-system,Helvetica,sans-serif',T='Rockwell,Georgia,serif';
let im=null;if(r.img)im=await new Promise(o=>{const i=new Image();i.onload=()=>o(i);i.onerror=()=>o(null);i.src=r.img});
const c=document.createElement('canvas'),x=c.getContext('2d');
const wrap=(a,f,w)=>{x.font=f;const o=[];let l='';a.split(' ').forEach(k=>{const n=l?l+' '+k:k;if(l&&x.measureText(n).width>w){o.push(l);l=k}else l=n});o.push(l);return o};
const items=(a,pf)=>String(a||'').split('\n').filter(k=>k.trim()).flatMap((k,n)=>wrap(k,'32px '+F,tw-30).map((l,i)=>(i?'      ':pf(n))+l));
const tl=wrap(r.n,'bold 62px '+T,tw),ing=items(r.i,()=>'•  '),stp=items(r.s,n=>(n+1)+'.  '),tg=[r.p,r.t,r.m,r.d,r.c].filter(Boolean).join('  ·  '),ph=im?700:0;
const pass=d=>{const t=(s,f,col,yy)=>{if(d){x.font=f;x.fillStyle=col;x.fillText(s,P,yy)}};
if(d){x.fillStyle='#0F0B09';x.fillRect(0,0,W,c.height);if(im){x.save();x.beginPath();x.rect(0,0,W,ph);x.clip();const s=Math.max(W/im.width,ph/im.height);x.drawImage(im,(W-im.width*s)/2,(ph-im.height*s)/2,im.width*s,im.height*s);x.restore()}}
let y=ph+P+50;tl.forEach(l=>{t(l,'bold 62px '+T,'#F3EDE6',y);y+=72});
if(d){x.font='54px '+F;const sw=x.measureText('★★★★★').width;x.fillStyle='#4A3D34';x.fillText('★★★★★',P,y+10);x.save();x.beginPath();x.rect(P,y-60,sw*r.r/5,90);x.clip();x.fillStyle='#E8631A';x.fillText('★★★★★',P,y+10);x.restore();x.font='32px '+F;x.fillStyle='#D9CEC4';x.fillText(r.r?r.r.toFixed(1):'',P+sw+24,y+6)}
y+=62;if(tg){t(tg,'30px '+F,'#A89C92',y);y+=50}
if(ing.length){y+=30;t('INGREDIENTS','bold 26px '+F,'#E8631A',y);y+=48;ing.forEach(l=>{t(l,'32px '+F,'#F3EDE6',y);y+=46})}
if(stp.length){y+=36;t('STEPS','bold 26px '+F,'#E8631A',y);y+=48;stp.forEach(l=>{t(l,'32px '+F,'#F3EDE6',y);y+=46})}
y+=64;t('Smokehouse Notes','bold 30px '+T,'#E8631A',y);return y+50};
const H=pass(false);c.width=W;c.height=H;pass(true);
c.toBlob(b=>{const f=new File([b],(r.n||'recipe').replace(/[^\w ]+/g,'').trim()+'.png',{type:'image/png'}),u=URL.createObjectURL(b);
const s=sheet(`<button class="x" data-x>‹ Back</button><h2>Share recipe</h2><img src="${u}" style="width:100%;border-radius:12px"><button class="btn" id="go">Share</button><p style="color:var(--mu);margin-top:10px;font-size:13px">Or press and hold the image to save it. Comments and the video link are not included.</p>`);
s.querySelector('#go').onclick=async()=>{if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else alert('Press and hold the image to save it.')}},'image/png')}
function shrink(f){return new Promise(ok=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.75))};im.src=u})}
function form(r={}){let rt=r.r||0,img=r.img||'';
const s=sheet(`<button class="x" data-x>‹ Cancel</button><h2>${r.id?'Edit recipe':'New recipe'}</h2>
<label>Photo</label><input type="file" id="fi" accept="image/*">
<label>Name</label><input id="n" value="${esc(r.n)}" placeholder="Reverse sear ribeye">
<label>Rating (tap a star; tap the left half for a half star; tap again to clear)</label><div class="st" id="rs" style="font-size:36px">★★★★★<b style="width:${rt*20}%">★★★★★</b></div>
<label>Protein</label><select id="p">${opts(P,r.p)}</select><label>Type</label><select id="t">${opts(T,r.t)}</select>
<label>Cooked on</label><select id="m">${opts(M,r.m)}</select><label>Difficulty</label><select id="d">${opts(D,r.d)}</select>
<label>Cook time</label><input id="c" value="${esc(r.c)}" placeholder="1h 15m">
<label>Ingredients (one per line)</label><textarea id="i" rows="6">${esc(r.i)}</textarea>
<label>Seasonings used (from Pantry)</label><div id="pnw">${PN.length?PN.map(x=>`<label class="pk"><input type="checkbox" value="${x.id}"${(r.pn||[]).includes(x.id)?' checked':''}>${esc(x.n)}</label>`).join(''):'<small style="color:var(--mu)">Add items in the Pantry tab first.</small>'}</div>
<label>Steps (one per line)</label><textarea id="s" rows="8">${esc(r.s)}</textarea>
<label>Comments</label><textarea id="k" rows="4">${esc(r.k)}</textarea>
<label>Video link (optional)</label><input id="v" type="url" value="${esc(r.v)}" placeholder="https://youtube.com/...">
<button class="btn" id="sv">Save recipe</button>`);
s.querySelector('#fi').onchange=async e=>{if(e.target.files[0])img=await shrink(e.target.files[0])};
s.querySelector('#rs').onclick=e=>{const b=e.currentTarget.getBoundingClientRect(),n=Math.min(5,Math.max(.5,Math.ceil((e.clientX-b.left)/b.width*10)/2));rt=n==rt?0:n;e.currentTarget.querySelector('b').style.width=rt*20+'%'};
s.querySelector('#sv').onclick=()=>{const g=i=>s.querySelector('#'+i).value.trim(),n=g('n');if(!n){alert('Enter a name');return}
const o={id:r.id||Date.now(),n,p:g('p'),t:g('t'),m:g('m'),d:g('d'),c:g('c'),i:g('i'),pn:[...s.querySelectorAll('#pnw input:checked')].map(z=>+z.value),s:g('s'),k:g('k'),v:g('v'),r:rt,f:r.f||false,img};
R=r.id?R.map(x=>x.id==r.id?o:x):[o,...R];save();show(1);s.remove()}}
async function exp(){const b=new Blob([JSON.stringify({recipes:R,pantry:PN})],{type:'application/json'}),f=new File([b],'smokehouse-backup.json',{type:'application/json'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}
$('#more').onclick=()=>{const s=sheet(`<button class="x" data-x>‹ Back</button><h2>Backup</h2><p>Recipes live on this device. Export a backup after adding recipes.</p><button class="btn" id="ex">Export backup</button><label>Import backup (replaces current recipes)</label><input type="file" id="im" accept=".json,application/json">`);
s.querySelector('#ex').onclick=exp;
s.querySelector('#im').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());const rec=Array.isArray(d)?d:d.recipes;if(!Array.isArray(rec)||rec.some(x=>!x.n))throw 0;if(confirm('Replace current data with '+rec.length+' recipes'+(d.pantry?' and '+d.pantry.length+' pantry items':'')+'?')){R=rec;if(d.pantry)PN=d.pantry;save();savePN();show();s.remove()}}catch(x){alert('That file is not a valid backup.')}}};
$('#q').oninput=e=>{q=e.target.value.toLowerCase().trim();const t0=tab;if(q&&tab=='home')tab='explore';show(t0==tab)};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.t=='add'){form();return}tab=b.dataset.t;show()};
$('#main').onclick=e=>{const t=e.target.closest('[data-id],[data-p],[data-go],[data-addpn],[data-pn],[data-pc]');if(!t)return;const d=t.dataset;
if(d.id)detail(d.id);else if(d.pn)pdetail(d.pn);else if('addpn' in d)pform();else if(d.pc){pc=d.pc;show(1)}else if(d.go){tab=d.go;show()}else if(d.p){pf=d.p;if(tab=='home')tab='explore';show(1)}};
load().then(([a,b])=>{R=a;PN=b;show()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
